<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightsmile Dental Group: the whole deal</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fafafa; }
  a { color: inherit; }
  header.top { padding: 20px 24px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header.top h1 { margin: 0 0 4px; font-size: 22px; }
  .deck { color: #444; margin: 0 0 14px; font-size: 14px; }
  .arc { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .arc .step { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #f0f0f0; color: #666; white-space: nowrap; }
  .arc .step.current { background: #2563eb; color: #fff; font-weight: 600; }
  .arc .sep { color: #bbb; margin: 0 4px; font-size: 12px; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 60px; }
  section { margin-bottom: 34px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #777; margin: 0 0 10px; }

  #search input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
  .try-row { margin-top: 8px; font-size: 12px; color: #777; }
  .try-row button { font: inherit; font-size: 12px; border: 1px solid #ccc; background: #fff; border-radius: 12px; padding: 2px 10px; margin-left: 6px; cursor: pointer; }
  .try-row button:hover { border-color: #2563eb; color: #2563eb; }

  #results { margin-top: 14px; }
  .results-summary { font-size: 14px; margin-bottom: 10px; }
  .hit-call { border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; background: #fff; }
  .hit-call .hit-head { display: flex; justify-content: space-between; align-items: baseline; }
  .hit-call .hit-head a { font-weight: 600; text-decoration: none; }
  .hit-call .hit-head a:hover { text-decoration: underline; }
  .hit-call ul { margin: 6px 0 0; padding-left: 18px; }
  .hit-call li { margin: 3px 0; font-size: 13px; color: #333; }
  .hit-call li mark { background: #fde047; padding: 0 2px; border-radius: 2px; }
  .empty { color: #777; font-size: 14px; }

  .calls { display: grid; gap: 10px; }
  .call-card { display: block; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; background: #fff; text-decoration: none; color: inherit; }
  .call-card:hover { border-color: #2563eb; }
  .call-card .eyebrow { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .04em; }
  .call-card .summary { font-size: 15px; margin: 4px 0 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0f0f0; color: #666; }
  .chip.band-SHIPPED { background: #dcfce7; color: #15803d; }
  .chip.band-SHIPPED_WITH_CORRECTIONS { background: #fef9c3; color: #854d0e; }
  .chip.verified { color: #15803d; }

  .ledger { display: grid; gap: 6px; }
  .ledger .row { display: grid; grid-template-columns: 70px 90px 1fr 90px; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid #eee; font-size: 13px; }
  .ledger .row.called_out { border-color: #fecaca; background: #fef2f2; }
  .ledger .call-tag { color: #999; font-size: 12px; }
  .ledger .who { font-weight: 600; }
  .ledger .who.called-out-tag { color: #b91c1c; }
  .ledger .due { color: #999; text-align: right; font-size: 12px; }

  footer.note { color: #999; font-size: 12px; padding: 20px 24px 40px; max-width: 980px; margin: 0 auto; }
</style>
</head>
<body>
  <header class="top">
    <h1 id="deal-title">Loading the deal…</h1>
    <p class="deck" id="deal-deck"></p>
    <div class="arc" id="deal-arc"></div>
  </header>

  <main>
    <section id="search">
      <h2>Search this deal</h2>
      <input id="search-input" type="text" placeholder="Search all 5 calls. Try ringhawk or tcpa." autocomplete="off">
      <div class="try-row">
        Quick tries:
        <button data-q="ringhawk">ringhawk</button>
        <button data-q="tcpa">tcpa</button>
        <button data-q="soc 2">soc 2</button>
      </div>
      <div id="results"></div>
    </section>

    <section id="calls-section">
      <h2>Calls</h2>
      <div class="calls" id="calls"></div>
    </section>

    <section id="ledger-section">
      <h2>What was promised</h2>
      <div class="ledger" id="ledger"></div>
    </section>
  </main>

  <footer class="note">
    Every line here traces to a spoken quote. Open a call to see the receipts.
  </footer>

  <script type="module">
    import { searchDeal } from './deal-index.mjs';

    const OWNER_NAME = { rep: 'Maya', buyer: 'Rahul', joint: 'Both', unknown: 'Unclear who' };

    function joinHuman(items) {
      if (items.length === 1) return items[0];
      if (items.length === 2) return `${items[0]} and ${items[1]}`;
      return `${items.slice(0, -1).join(', ')} and ${items[items.length - 1]}`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function markQuery(text, q) {
      const idx = text.toLowerCase().indexOf(q);
      if (idx < 0) return escapeHtml(text);
      return `${escapeHtml(text.slice(0, idx))}<mark>${escapeHtml(text.slice(idx, idx + q.length))}</mark>${escapeHtml(text.slice(idx + q.length))}`;
    }

    function phaseLabel(title) {
      return title.split(/[—-]/)[0].trim();
    }

    async function boot() {
      const res = await fetch('deal-index.json');
      const data = await res.json();
      const index = { calls: data.calls, records: data.records };
      const commitments = data.commitments;

      renderHeader(index);
      renderCalls(index);
      renderLedger(commitments);
      wireSearch(index);
    }

    function renderHeader(index) {
      const calls = index.calls;
      document.getElementById('deal-title').textContent = 'Brightsmile Dental Group';
      const last = calls[calls.length - 1];
      document.getElementById('deal-deck').textContent =
        `${calls.length} calls with CallForge. ${last.summary || `Now: ${last.stage}.`}`;

      const arc = document.getElementById('deal-arc');
      arc.innerHTML = calls
        .map((c, i) => {
          const isLast = i === calls.length - 1;
          const step = `<span class="step${isLast ? ' current' : ''}">${escapeHtml(phaseLabel(c.title))}</span>`;
          return i === 0 ? step : `<span class="sep">→</span>${step}`;
        })
        .join('');
    }

    function renderCalls(index) {
      const root = document.getElementById('calls');
      root.innerHTML = index.calls
        .map((c) => `
          <a class="call-card" href="${escapeHtml(c.href)}" target="_blank" rel="noopener">
            <div class="eyebrow">Call ${c.seq}: ${escapeHtml(phaseLabel(c.title))}</div>
            <div class="summary">${escapeHtml(c.summary || c.title)}</div>
            <div class="chips">
              <span class="chip verified">${c.verifiedCount} of ${c.totalClaims} verified</span>
              <span class="chip band-${escapeHtml(c.band)}">${escapeHtml(c.band.replace(/_/g, ' ').toLowerCase())}</span>
              ${c.stage ? `<span class="chip">${escapeHtml(c.stage)}</span>` : ''}
            </div>
          </a>`)
        .join('');
    }

    function renderLedger(commitments) {
      const root = document.getElementById('ledger');
      if (!commitments.length) {
        root.innerHTML = '<p class="empty">No commitments recorded yet.</p>';
        return;
      }
      root.innerHTML = commitments
        .map((e) => {
          const who = e.kind === 'called_out' ? 'Called out' : (OWNER_NAME[e.owner] ?? e.owner);
          const whoClass = e.kind === 'called_out' ? 'who called-out-tag' : 'who';
          return `
            <div class="row ${e.kind}">
              <span class="call-tag">Call ${e.callSeq}</span>
              <span class="${whoClass}">${escapeHtml(who)}</span>
              <span>${escapeHtml(e.text)}</span>
              <span class="due">${escapeHtml(e.due || '')}</span>
            </div>`;
        })
        .join('');
    }

    function bestSnippetsForCall(records, q, limit = 3) {
      // Show the human-readable claims first (competitors, objections, pain,
      // pricing, summary, next_steps), tracker matches and raw transcript
      // lines last. A query with no substantive hit still shows something.
      const rank = (r) => {
        if (r.source === 'claim' && r.extractor !== 'tracker') return 0;
        if (r.source === 'claim') return 1;
        return 2;
      };
      const sorted = [...records].sort((a, b) => rank(a) - rank(b));
      const seen = new Set();
      const out = [];
      for (const r of sorted) {
        if (seen.has(r.text)) continue;
        seen.add(r.text);
        out.push(r);
        if (out.length >= limit) break;
      }
      return out;
    }

    function wireSearch(index) {
      const input = document.getElementById('search-input');
      const results = document.getElementById('results');

      function run(q) {
        input.value = q;
        if (!q.trim()) {
          results.innerHTML = '';
          return;
        }
        const { callIds, hitsByCall, query } = searchDeal(index, q);
        if (!callIds.length) {
          results.innerHTML = `<p class="empty">No hits for "${escapeHtml(q)}". Try ringhawk or tcpa.</p>`;
          return;
        }
        const callNums = callIds.map((id) => index.calls.find((c) => c.id === id).seq);
        const summaryLine = `Shows up in call${callNums.length > 1 ? 's' : ''} ${joinHuman(callNums)}.`;

        const cards = callIds
          .map((id) => {
            const call = index.calls.find((c) => c.id === id);
            const snippets = bestSnippetsForCall(hitsByCall[id], query);
            return `
              <div class="hit-call">
                <div class="hit-head">
                  <a href="${escapeHtml(call.href)}" target="_blank" rel="noopener">Call ${call.seq}: ${escapeHtml(phaseLabel(call.title))}</a>
                  <span class="call-tag">${hitsByCall[id].length} hit${hitsByCall[id].length > 1 ? 's' : ''}</span>
                </div>
                <ul>${snippets.map((s) => `<li>${markQuery(s.text, query)}</li>`).join('')}</ul>
              </div>`;
          })
          .join('');

        results.innerHTML = `<p class="results-summary">${escapeHtml(summaryLine)}</p>${cards}`;
      }

      input.addEventListener('input', () => run(input.value));
      document.querySelectorAll('.try-row button').forEach((btn) => {
        btn.addEventListener('click', () => run(btn.dataset.q));
      });
    }

    boot().catch((err) => {
      document.getElementById('deal-title').textContent = 'Could not load the deal';
      document.getElementById('deal-deck').textContent = err.message;
    });
  </script>
</body>
</html>
